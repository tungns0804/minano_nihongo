<!-- Bỏ qua header: người dùng bàn phím (và trình đọc màn hình) không phải Tab qua
     thương hiệu + 3 mục menu + 2 nút ở MỌI trang mới tới được nội dung. Nằm ngoài
     màn hình cho tới khi nhận focus.

     Là <button> chứ không phải <a href="#main-content">: bản offline định tuyến bằng
     dấu # nên router sẽ hiểu href đó là một đường dẫn và ném người dùng ra khỏi trang
     — đúng cái bẫy mà mục lục bài ngữ pháp cũng phải tránh. -->
<button type="button" class="skip-link" (click)="focusMain()">
  <app-t key="app.skipToContent" />
</button>

<header class="app-header" #appHeader>
  <div class="container app-header-inner">
    <a routerLink="/" class="brand">
      <span class="brand-mark jp" aria-hidden="true">語</span>
      <span class="brand-text">
        <span class="brand-title">
          <!-- &ngsp; là dấu cách thật, không bị Angular gộp bỏ. Đặt bên trong thẻ này
               để khi ẩn phần mô tả ở màn hình hẹp thì dấu cách cũng biến mất theo. -->
          <span class="brand-prefix"><app-t key="app.namePrefix" />&ngsp;</span>
          <span class="jp brand-jp">皆の日本語</span>
        </span>
        <span class="brand-sub"><app-t key="app.tagline" /></span>
      </span>
    </a>

    <!-- Menu là em ruột của .app-actions, không nằm trong đó: header là một lưới hai
         hàng và menu chiếm trọn hàng dưới (xem .app-header-inner), nên nó phải là ô
         lưới riêng chứ không nằm lồng trong ô của hai nút. -->
    <nav class="app-nav" [attr.aria-label]="t('app.nav')">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        <app-t key="app.nav.lessons" />
      </a>
      <a routerLink="/topic" routerLinkActive="is-active"><app-t key="app.nav.topic" /></a>
      <a routerLink="/n3" routerLinkActive="is-active" class="nav-n3">
        <app-t key="app.nav.n3" />
      </a>
      <a routerLink="/kanji" routerLinkActive="is-active"><app-t key="app.nav.kanji" /></a>
      <a routerLink="/radical" routerLinkActive="is-active"><app-t key="app.nav.radical" /></a>
      <a routerLink="/grammar" routerLinkActive="is-active"><app-t key="app.nav.grammar" /></a>
      <a routerLink="/exercise" routerLinkActive="is-active"><app-t key="app.nav.exercise" /></a>
      @if (importEnabled) {
        <a routerLink="/import" routerLinkActive="is-active"><app-t key="app.nav.import" /></a>
      }
    </nav>

    <div class="app-actions">
      <button
        type="button"
        class="icon-btn lang-btn"
        (click)="lang.toggle()"
        [title]="t('app.language.switch', { name: lang.nextName() })"
        [attr.aria-label]="t('app.language.switch', { name: lang.nextName() })"
      >
        <span class="icon-btn-glyph" aria-hidden="true">🌐</span>
        <span class="icon-btn-label lang-label">{{ lang.short() }}</span>
      </button>

      <button
        type="button"
        class="icon-btn theme-btn"
        (click)="theme.cycle()"
        [title]="
          t('theme.title', { current: t(theme.labelKey()), next: t(theme.nextLabelKey()) })
        "
        [attr.aria-label]="
          t('theme.title', { current: t(theme.labelKey()), next: t(theme.nextLabelKey()) })
        "
      >
        <span class="icon-btn-glyph" aria-hidden="true">{{ theme.icon() }}</span>
        <span class="icon-btn-label">
          <app-t [key]="theme.labelKey()" />
        </span>
      </button>
    </div>
  </div>
</header>

<!-- Thanh tiến trình chuyển trang. Luôn nằm trong DOM và chỉ đổi độ mờ, cùng lý do
     với nút "lên đầu trang" bên dưới: bật/tắt bằng @if thì nó bụp một cái.

     Nằm NGAY DƯỚI header và cũng dính (sticky) theo header, để cú bấm menu và phản
     hồi cho cú bấm đó ở sát nhau — người dùng không phải nhìn sang chỗ khác.

     Không khai role="progressbar": thanh này chạy vô định, không có phần trăm nào
     để đọc. role="status" cho trình đọc màn hình biết trang đang tải, còn vệt vẽ
     thì aria-hidden.

     Lời báo là NỘI DUNG bên trong (thêm vào rồi bỏ đi), không phải aria-label:
     role="status" chỉ đọc khi nội dung của vùng đó thay đổi, còn đổi giá trị một
     thuộc tính thì phần lớn trình đọc màn hình bỏ qua. -->
<div class="route-progress" [class.is-active]="navigating()" role="status">
  @if (navigating()) {
    <span class="sr-only">{{ t('app.navigating') }}</span>
  }
  <span class="route-progress-bar" aria-hidden="true"></span>
</div>

<main id="main-content" tabindex="-1">
  <router-outlet />
</main>

<!-- Nút quay lên đầu trang. Luôn nằm trong DOM, chỉ mờ đi và không nhận chuột khi
     chưa cuộn đủ xa — bật/tắt bằng @if thì nó bụp một cái, không có gì để chuyển. -->
<button
  type="button"
  class="to-top"
  [class.is-visible]="scrolledDown()"
  [attr.aria-hidden]="scrolledDown() ? null : 'true'"
  [attr.tabindex]="scrolledDown() ? null : -1"
  (click)="scrollToTop()"
  [title]="t('app.backToTop')"
  [attr.aria-label]="t('app.backToTop')"
>
  <span aria-hidden="true">↑</span>
</button>
