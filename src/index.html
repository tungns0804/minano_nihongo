<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Ôn tập từ vựng 皆の日本語</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ôn tập từ vựng 皆の日本語: luyện Kanji, âm Hán Việt và nghĩa tiếng Việt theo 4 chiều, có chế độ trắc nghiệm và gõ đáp án.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Montserrat (chữ thường) + Quicksand (tiêu đề), cùng cặp font với ByeTOEIC. Cả
       hai có bộ ký tự tiếng Việt. Không tải được (bản offline, mạng chặn) thì
       --font-ui trong styles.css rơi về Segoe UI, trang vẫn đọc bình thường. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400..700&family=Quicksand:wght@500..700&display=swap">
  <script>
    // Áp dụng tông màu đã lưu NGAY trước khi Angular khởi động, nếu không trang sẽ
    // chớp màu hệ thống một nhịp rồi mới đổi. Giữ đoạn này đồng bộ với ThemeStore.
    try {
      var saved = JSON.parse(localStorage.getItem('jp-practice:theme') || '""');
      if (saved === 'light' || saved === 'dark' || saved === 'night') {
        document.documentElement.setAttribute('data-theme', saved);
      }
      var lang = JSON.parse(localStorage.getItem('jp-practice:language') || '""');
      if (lang === 'vi' || lang === 'ja') document.documentElement.lang = lang;
    } catch (e) { /* localStorage bị chặn thì cứ theo mặc định */ }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
