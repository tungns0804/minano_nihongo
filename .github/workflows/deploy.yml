name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Cho phép bấm chạy tay trong tab Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Đang deploy dở mà có push mới thì huỷ lượt cũ, không xếp hàng.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sinh lại public/lessons/ từ data-source/ để bản deploy luôn khớp nguồn.
      - run: npm run generate

      # Soát dữ liệu TRƯỚC khi build. Trước đây bước này không có, nên một lộ
      # trình N3 trỏ tới bài học không tồn tại, hay một khoá dịch thiếu, vẫn lên
      # trang thật rồi mới hỏng trong tay người dùng.
      #
      # `verify:ci` nay gom ca `verify:audio`. Truoc day khong the: bai N3 con
      # thieu 205 file mp3, nen cong nay se do o moi lan deploy vi mot viec khong
      # lien quan gi toi thay doi dang deploy — ma mot cong luon do thi khong ai
      # doc nua. Nay 205 file do da sinh xong, va thieu mp3 nghia la nut loa chet
      # tren trang that, nen chan lai la dung.
      - run: npm run verify:ci

      # base-href phải là tên repo vì trang nằm ở <user>.github.io/minano_nihongo/
      - run: npx ng build --base-href /minano_nihongo/

      - name: Thêm SPA fallback và tắt Jekyll
        run: |
          # GitHub Pages không biết route của Angular: mở thẳng /lesson/abc rồi F5
          # sẽ ra 404. Trả chính index.html cho mọi đường dẫn lạ để router tự xử lý.
          cp dist/minano-nihongo/browser/index.html dist/minano-nihongo/browser/404.html
          # Không có file này thì Jekyll bỏ qua các file/thư mục bắt đầu bằng _ .
          touch dist/minano-nihongo/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/minano-nihongo/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
